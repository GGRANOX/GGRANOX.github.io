/* Layout: engineering-minimal single column (max 1120px) over a live character field; serif only for the name and section titles. */
:root {
  --bg: #F5F8F5;
  --surface: #FFFFFF;
  --fg: #101913;
  --muted: #56645B;
  --line: #D9E2DB;
  --accent: #1B7748;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2F0E7;
  --field: #1B7748;
  --field-strength: .8;

  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --step--1: .8125rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: clamp(1.9rem, 1.4rem + 2vw, 2.6rem);
  --step-4: clamp(3rem, 1.8rem + 6vw, 6.25rem);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C120E; --surface: #121A15; --fg: #E5ECE7; --muted: #93A398; --line: #233029;
    --accent: #5CC38D; --accent-ink: #06130C; --accent-soft: #15281D; --field: #5CC38D; --field-strength: .7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C120E; --surface: #121A15; --fg: #E5ECE7; --muted: #93A398; --line: #233029;
  --accent: #5CC38D; --accent-ink: #06130C; --accent-soft: #15281D; --field: #5CC38D; --field-strength: .7;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#field { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.wrap {
  position: relative; z-index: 1;
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 700px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.mark { font-family: var(--mono); font-size: var(--step--1); font-weight: 500; text-decoration: none; letter-spacing: .02em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lang { flex: none; }
.mark span { color: var(--accent); }
.nav { display: flex; gap: 20px; margin-left: auto; }
.nav a { font-size: .875rem; color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--fg); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.lang button {
  font: 500 .75rem/1 var(--mono); letter-spacing: .06em; color: var(--muted);
  background: none; border: 0; border-radius: 999px; padding: 7px 10px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 899px) { .nav { display: none; } .lang { margin-left: auto; } }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, .8fr); gap: 56px; align-items: center; padding-block: 72px 56px; }
.hero-text { min-width: 0; display: grid; gap: 22px; justify-items: start; }
.status {
  display: inline-flex; align-items: center; gap: 10px;
  font: 500 .8125rem/1.3 var(--mono); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px 7px 12px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); animation: pulse 2.4s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
h1 {

  line-height: .92; letter-spacing: -.015em; margin: 0; text-wrap: balance;
}
.role { font: 500 var(--step-1)/1.4 var(--mono); color: var(--accent); margin: 0; min-height: 1.4em; }
.study { margin: -10px 0 0; color: var(--muted); font-size: .9375rem; }
.study b { color: var(--fg); font-weight: 600; }
.pitch { margin: 0; font-size: var(--step-1); max-width: 34em; text-wrap: pretty; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 .9375rem/1 var(--body); text-decoration: none; cursor: pointer;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 12px 18px; transition: border-color .15s, transform .15s;
}
.btn:hover { border-color: var(--fg); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn .mono { font-family: var(--mono); font-size: .8125rem; }
.facts { list-style: none; margin: 6px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: .875rem; color: var(--muted); width: 100%; }
.facts b { font: 500 .875rem var(--mono); color: var(--fg); margin-right: 6px; }

.portrait { margin: 0; min-width: 0; justify-self: end; width: 100%; max-width: 380px; }
.portrait img { width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); background: #fff; }
.portrait figcaption { font: .75rem/1.4 var(--mono); color: var(--muted); margin-top: 10px; }
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; gap: 32px; padding-block: 36px 40px; }
  .portrait { order: -1; justify-self: start; max-width: 200px; }
}

/* ---------- sections ---------- */
.sec { padding-block: 56px; border-top: 1px solid var(--line); }
.sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 32px; }
.sec-head h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-3); line-height: 1; margin: 0; letter-spacing: -.01em; }
.count { font: .8125rem var(--mono); color: var(--muted); }

.rows { display: grid; gap: 36px; }
.row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 24px; }
.when { font: .8125rem/1.7 var(--mono); color: var(--muted); padding-top: 3px; }
.row h3 { margin: 0; font-size: var(--step-1); font-weight: 600; line-height: 1.35; }
.org { margin: 2px 0 10px; color: var(--muted); }
.row ul:not(.tags), .card ul:not(.tags) { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.row li::marker, .card li::marker { color: var(--accent); }
.prize { display: inline-block; font: 500 .75rem/1.4 var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 5px 9px; margin-bottom: 12px; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; gap: 6px; } }

.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 14px 0 0; }
.tags li { font: .75rem/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); }

/* projects */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: flex; flex-direction: column; min-width: 0; }
.card .meta { font: .75rem/1.5 var(--mono); color: var(--muted); margin: 0 0 12px; }
.card h3 { margin: 0; font-size: 1.3rem; font-weight: 600; line-height: 1.25; }
.card .sub { margin: 4px 0 12px; color: var(--muted); }
.card p.desc { margin: 0 0 12px; }
.card .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 18px; }
.card .links a { font: 500 .8125rem/1 var(--mono); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; }
.card .links a:hover { border-color: var(--fg); }
.card .links a.go { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.card.feat { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 40px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card.feat h3 { font-family: var(--display); font-size: var(--step-3); line-height: 1; }

/* skills */
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 32px; }

/* beyond code */
.beyond { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.beyond details { border-bottom: 1px solid var(--line); }
.beyond summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; font-weight: 500; }
.beyond summary::-webkit-details-marker { display: none; }
.beyond summary::after { content: "+"; font-family: var(--mono); color: var(--accent); }

.beyond details p { margin: -4px 0 16px; color: var(--muted); max-width: 40em; }
@media (max-width: 640px) { .beyond { grid-template-columns: 1fr; } }

/* contact + footer */
.contact { padding-block: 64px 40px; border-top: 1px solid var(--line); display: grid; gap: 18px; justify-items: start; }
.contact h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-4); line-height: .95; margin: 0; }
.contact p { margin: 0; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font: .75rem/1.5 var(--mono); color: var(--muted); padding-block: 24px 40px; border-top: 1px solid var(--line); }

.print-only { display: none; }

/* ---------- print / PDF ---------- */
@media print {
  @page { size: A4; margin: 13mm 14mm; }
  :root { --bg: #fff; --surface: #fff; --fg: #111; --muted: #4a4a4a; --line: #d6d6d6; --accent: #1B7748; --accent-soft: #fff; color-scheme: light; }

  .hero { grid-template-columns: 1fr 96px; gap: 20px; padding-block: 0 12px; }
  .portrait { order: 0; max-width: 96px; justify-self: end; }
  .hero-text { gap: 6px; }
  h1 { font-size: 26pt; }
  .role { font-size: 10.5pt; }
  .study { margin: 0; }
  .pitch { font-size: 9.5pt; }
  .print-only { display: block; }

  .pcontacts .qr { display: flex; gap: 8px; align-items: center; font-size: 7.5pt; color: var(--muted); }

  .sec { padding-block: 10px; break-inside: auto; }
  .sec-head { margin-bottom: 8px; }
  .sec-head h2 { font-size: 15pt; }
  .rows { gap: 10px; }
  .row { grid-template-columns: 110px 1fr; gap: 12px; break-inside: avoid; }
  .grid { gap: 8px; }
  .card { padding: 10px 12px; break-inside: avoid; border-radius: 6px; }
  .card.feat h3 { font-size: 14pt; }
  .card h3 { font-size: 10.5pt; }
  .card .sub, .card .meta { margin-bottom: 4px; }
  .tags { margin-top: 6px; }
  .tags li { padding: 3px 5px; font-size: 7.5pt; }
  .skills { grid-template-columns: repeat(3, 1fr); gap: 8px 16px; }
  .beyond { grid-template-columns: 1fr 1fr; }
  .beyond summary { padding: 4px 0 0; }
  .beyond summary::after { content: none; }
  .beyond details p { margin: 0 0 4px; }
  .beyond details { border: 0; break-inside: avoid; }
  .foot { padding-block: 8px 0; }
  a { text-decoration: none; }
}
</style>

      { when: "2015 — 2024", role: "№33 орта мектеп", org: "Негізгі орта білім", points: ["GPA 5.0 / 5.0, үздік аттестат"] }
    ],
    beyond: [
      ["Бейнелеу өнері және дизайн", "Халықаралық сурет байқауының жеңімпазы. Дамыған визуалды талғам өнім әзірлеуде және UX/UI-да көмектеседі."],
      ["Нетворкинг және презентация", "Топ-менеджмент, бизнес көшбасшылары және IQanat қамқоршылары алдында презентация жасау тәжірибесі."],
      ["Қол шеберлігі", "Карта техникасы және микромагия: нетворкингте, соның ішінде маңызды адамдармен және инвесторлармен танысуда жақсы ice-breaker."],
      ["Шахмат", "3-разряд. Жүйелі және стратегиялық ойлау."],
      ["Бальдық билер", "Халықаралық турнирлерге қатысып, жеңіске жеттім. Тәртіп пен сахнада өзін ұстау."],
      ["Спорт", "Баскетбол және тұрақты күш жаттығулары."]
    ],
    contactTitle: "Хабарласыңыз",
    contactText: "Маған ең жылдам Telegram арқылы жазуға болады.",
    hint: "Фон тірі: курсорды жылжытыңыз немесе кез келген жерді басыңыз."
  }
};

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const pad = n => String(n).padStart(2, "0");
const tags = list => list.length ? `<ul class="tags">${list.map(s => `<li>${s}</li>`).join("")}</ul>` : "";
const bullets = list => list.length ? `<ul>${list.map(s => `<li>${s}</li>`).join("")}</ul>` : "";
const ext = 'target="_blank" rel="noopener"';

function section(id, t, count, body) {
  return `<section class="sec" id="${id}"><div class="sec-head"><h2>${t.nav[id]}</h2><span class="count">${pad(count)}</span></div>${body}</section>`;
}
function rows(items) {
  return `<div class="rows">${items.map(it => `
    <div class="row">
      <div class="when">${it.when}</div>
      <div>
        <h3>${it.role}</h3>
        <p class="org">${it.org}</p>
        ${it.prize ? `<span class="prize">${it.prize}</span>` : ""}
        ${bullets(it.points)}
        ${it.tags ? tags(it.tags) : ""}
        ${it.link ? `<p style="margin:14px 0 0"><a class="btn" href="${it.link}" ${ext}>${it.linkLabel} ↗</a></p>` : ""}
      </div>
    </div>`).join("")}</div>`;
}
function card(p, t) {
  const links = p.links.length ? `<div class="links">${p.links.map(([k, href], i) =>
    `<a class="${i === 0 ? "go" : ""}" href="${href}" ${ext}>${t.links[k]} ↗</a>`).join("")}</div>` : "";
  if (p.feat) {
    return `<article class="card feat">
      <div class="left">
        <span class="flag">★ ${t.flag}</span>
        <p class="meta">${p.meta}</p>
        <h3>${p.title}</h3>
        <p class="sub">${p.sub}</p>
        <p class="desc">${p.desc}</p>
        ${links}
      </div>
      <div class="right">${bullets(p.points)}${tags(p.stack)}</div>
    </article>`;
  }
  return `<article class="card">
    <p class="meta">${p.meta}</p>
    <h3>${p.title}</h3>
    <p class="sub">${p.sub}</p>
    <p class="desc">${p.desc}</p>
    ${bullets(p.points)}
    ${tags(p.stack)}
    ${links}
  </article>`;
}

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  document.getElementById("nav").innerHTML = ["experience", "projects", "skills", "leadership", "education", "beyond"]
    .map(id => `<a href="#${id}">${t.nav[id]}</a>`).join("");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const exp = t.experience.map(e => CLIENT_SITE_URL ? { ...e, link: CLIENT_SITE_URL, linkLabel: t.links.client } : e);
  const beyondOpen = (() => { try { return localStorage.getItem("cv-beyond") === "open"; } catch (e) { return false; } })();

  document.getElementById("top").innerHTML = `
    <section class="hero">
      <div class="hero-text">
        <span class="status"><span class="dot"></span>${t.status}</span>
        <h1>${t.name}</h1>
        <p class="role"><span class="sr-only">${t.role}</span><span id="roleText" aria-hidden="true">${t.role}</span></p>
        <p class="study">${t.study}</p>
        <div class="print-only pcontacts">
          <div>${EMAIL} · t.me/GGRANOX · github.com/GGRANOX<br>linkedin.com/in/artyom-krasnobrizh-86048140a</div>
          <div class="qr"><span>${t.cta.web}<br>${SITE_URL.replace("https://", "")}</span><span id="qr"></span></div>
        </div>
        <p class="pitch">${t.pitch}</p>
        <div class="cta">
          <a class="btn primary" href="${LINKS.telegram}" ${ext}>${ICON_TG}${t.cta.tg}</a>
          <button class="btn" type="button" id="copyEmail" title="${t.cta.copy}"><span class="mono">${EMAIL}</span>${ICON_COPY}<span class="sr-only">${t.cta.copy}</span></button>
          <a class="btn" href="${LINKS.github}" ${ext}>GitHub ↗</a>
          <a class="btn" href="${LINKS.linkedin}" ${ext}>LinkedIn ↗</a>
          ${inFrame ? "" : `<button class="btn" type="button" id="pdfBtn">${ICON_DL}${t.cta.pdf}</button>`}
        </div>
        <ul class="facts">${t.facts.map(([n, s]) => `<li><b>${n}</b>${s}</li>`).join("")}</ul>
      </div>
      <figure class="portrait">
        <img src="photo.jpg" width="640" height="640" alt="${t.name}">
        <figcaption>${t.photo}</figcaption>
      </figure>
    </section>
    ${section("experience", t, exp.length, rows(exp))}
    ${section("projects", t, t.projects.length, `<div class="grid">${t.projects.map(p => card(p, t)).join("")}</div>`)}
    ${section("skills", t, t.skills.length, `<div class="skills">${t.skills.map(([h, list]) => `<div><h3>${h}</h3>${tags(list)}</div>`).join("")}</div>`)}
    ${section("leadership", t, t.leadership.length, rows(t.leadership))}
    ${section("education", t, t.education.length, rows(t.education))}
    ${section("beyond", t, t.beyond.length, `<div class="beyond">${t.beyond.map(([h, p], i) =>
      `<details id="beyond-${i}"${beyondOpen ? " open" : ""}><summary>${h}</summary><p>${p}</p></details>`).join("")}</div>`)}
    <section class="contact">
      <h2>${t.contactTitle}</h2>
      <p>${t.contactText}</p>
      <div class="cta">
        <a class="btn primary" href="${LINKS.telegram}" ${ext}>${ICON_TG}${t.cta.tg}</a>
        <a class="btn" href="mailto:${EMAIL}"><span class="mono">${EMAIL}</span></a>
      </div>
    </section>
    <footer class="foot">
      <span>© 2026 ${t.name}</span>
      <span class="hint">${t.hint}</span>
    </footer>`;

  document.getElementById("copyEmail").addEventListener("click", e => copyEmail(e.currentTarget, t));
  const pdf = document.getElementById("pdfBtn");
  if (pdf) pdf.addEventListener("click", () => window.print());
  makeQR();
  decode(document.getElementById("roleText"), t.role);
}

function copyEmail(btn, t) {
  const label = btn.querySelector(".mono");
  const done = () => { label.textContent = t.cta.copied; setTimeout(() => { label.textContent = EMAIL; }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(label); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(EMAIL).then(done, fallback); } catch (e) { fallback(); }
}

function makeQR() {
  const el = document.getElementById("qr");
  if (!el || typeof QRCode === "undefined") return;
  try { new QRCode(el, { text: SITE_URL, width: 124, height: 124, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
}

/* Role line resolves from code-like glyphs, matching the background field */
function decode(el, text) {
  if (!el || reduceMotion.matches) return;
  const glyphs = "01<>/{}[]#*+=";
  const start = performance.now(), dur = 750;
  function step(now) {
    const p = Math.min(1, (now - start) / dur);
    const n = Math.floor(p * text.length);
    let out = text.slice(0, n);
    for (let i = n; i < text.length; i++) out += text[i] === " " ? " " : glyphs[(Math.random() * glyphs.length) | 0];
    el.textContent = out;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(() => { el.textContent = text; }, dur + 400);  // rAF pauses in background tabs
}

/* ---------- language ---------- */
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  try { const s = localStorage.getItem("cv-lang"); if (s && T[s]) return s; } catch (e) {}
  return "en";
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  const lang = b.dataset.lang;
  try { localStorage.setItem("cv-lang", lang); } catch (e) {}
  render(lang);
}));
document.addEventListener("toggle", e => {
  if (!e.target.matches || !e.target.matches(".beyond details")) return;
  const any = [...document.querySelectorAll(".beyond details")].some(d => d.open);
  try { localStorage.setItem("cv-beyond", any ? "open" : "closed"); } catch (err) {}
}, true);

/* print: expand every collapsible so the PDF is complete */
let printOpened = [];
addEventListener("beforeprint", () => {
  printOpened = [...document.querySelectorAll("details:not([open])")];
  printOpened.forEach(d => d.open = true);
});
addEventListener("afterprint", () => { printOpened.forEach(d => d.open = false); printOpened = []; });

render(pickLang());
if (location.hash.length > 1) {
  const jump = () => { const target = document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); };
  jump();
  addEventListener("load", jump, { once: true });
}

/* ---------- character field ---------- */
(function field() {
  const cv = document.getElementById("field");
  const ctx = cv.getContext("2d");
  if (!ctx) return;
  const coarse = matchMedia("(pointer: coarse)").matches;
  const RAMP = [" ", ".", "·", ":", "-", "=", "+", "*", "#", "%", "@"];
  const GLITCH = ["0", "1", "/", "\\", "<", ">", "{", "}", "[", "]", "#", "*", "+", "=", "?", "λ"];
  const ALL = [...new Set([...RAMP, ...GLITCH])].filter(c => c !== " ");
  const WAVE_LIFE = 2200, WAVE_SPEED = .55, WAVE_WIDTH = 38, CURSOR_R = 110;

  let W = 0, H = 0, dpr = 1, cell = 16, cols = 0, rows = 0, seeds = new Float32Array(0);
  let atlas = {}, color = "#1B7748", strength = .5, last = 0;
  const ptr = { x: -9999, y: -9999, w: 0, target: 0 };
  const waves = [];

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    color = cs.getPropertyValue("--field").trim() || color;
    strength = parseFloat(cs.getPropertyValue("--field-strength")) || strength;
  }
  function buildAtlas() {
    readTheme();
    atlas = {};
    const s = Math.ceil(cell * dpr);
    for (const ch of ALL) {
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      g.fillStyle = color;
      g.font = `500 ${Math.round(cell * .74 * dpr)}px "IBM Plex Mono", ui-monospace, monospace`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(ch, s / 2, s / 2);
      atlas[ch] = c;
    }
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = document.documentElement.clientWidth; H = innerHeight;
    cell = W < 700 ? 18 : 15;
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    cols = Math.ceil(W / cell) + 1; rows = Math.ceil(H / cell) + 1;
    seeds = new Float32Array(cols * rows);
    for (let i = 0; i < seeds.length; i++) seeds[i] = Math.random();
    buildAtlas();
    if (reduceMotion.matches) draw(0);
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ptr.w += (ptr.target - ptr.w) * .08;
    for (let i = waves.length - 1; i >= 0; i--) if (t - waves[i].t > WAVE_LIFE) waves.splice(i, 1);
    const R2 = 2 * CURSOR_R * CURSOR_R, step = cell * dpr;
    for (let r = 0; r < rows; r++) {
      const y = r * cell + cell / 2;
      for (let c = 0; c < cols; c++) {
        const x = c * cell + cell / 2, sd = seeds[r * cols + c];
        let v = .13 + .08 * Math.sin(c * .21 + t * .00045 + sd * .6) * Math.cos(r * .17 - t * .00035) + .05 * Math.sin((c + r) * .08 + t * .0002);
        if (ptr.w > .01) { const dx = x - ptr.x, dy = y - ptr.y; v += ptr.w * .75 * Math.exp(-(dx * dx + dy * dy) / R2); }
        let wb = 0;
        for (const w of waves) {
          const age = t - w.t, dx = x - w.x, dy = y - w.y;
          const k = (Math.sqrt(dx * dx + dy * dy) - age * WAVE_SPEED) / WAVE_WIDTH;
          if (k > -3 && k < 3) wb += Math.exp(-k * k) * (1 - age / WAVE_LIFE);
        }
        v += wb * .85;
        if (v < .06) continue;
        if (v > 1) v = 1;
        const ch = wb > .22
          ? GLITCH[(Math.floor(sd * 97) + Math.floor(t / 70)) % GLITCH.length]
          : RAMP[Math.min(RAMP.length - 1, Math.max(1, Math.round(v * (RAMP.length - 1))))];
        const g = atlas[ch];
        if (!g) continue;
        ctx.globalAlpha = v * strength;
        ctx.drawImage(g, c * step, r * step);
      }
    }
    ctx.globalAlpha = 1;
  }
  function loop(t) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    if (coarse && t - last < 33) return;
    last = t;
    draw(t);
  }

  let rz;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(resize, 120); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { buildAtlas(); if (reduceMotion.matches) draw(0); });
  new MutationObserver(() => { buildAtlas(); if (reduceMotion.matches) draw(0); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildAtlas(); if (reduceMotion.matches) draw(0); });

  resize();
  if (reduceMotion.matches) return;

  addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.target = 1;
  }, { passive: true });
  document.documentElement.addEventListener("pointerleave", () => { ptr.target = 0; });
  addEventListener("blur", () => { ptr.target = 0; });
  addEventListener("pointerdown", e => {
    waves.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (waves.length > 6) waves.shift();
  }, { passive: true });
  requestAnimationFrame(loop);
})();
</script>
